    "mcp>=1.3.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "path>=17.1.1",
    "pillow>=10.0.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
